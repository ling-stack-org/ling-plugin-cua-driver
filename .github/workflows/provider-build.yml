name: Provider native build

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Target with the locked native toolchain
        required: true
        options: [darwin, win32-x64]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ${{ inputs.platform == 'darwin' && 'macos-26' || 'windows-2022' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PROVIDER_TARGET: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - name: Prepare the locked Rust toolchain
        run: |
          rust_version=$(node -p 'require("./provider/0.8.3-ling.1/source-build-inputs.json").toolchain.rustcVersion')
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt
      - name: Install the locked Windows Build Tools
        if: inputs.platform == 'win32-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'vs_BuildTools-17.14.36.exe'
          $installPath = Join-Path $env:RUNNER_TEMP 'ling-vs-buildtools'
          $sha256 = '5ae95bb02bb3442441a8d891e5bb1d2975445e2e3ee16ada5bc7bd17227f1dd7'
          $url = "https://download.visualstudio.microsoft.com/download/pr/12aa1305-dd17-4f26-8429-d072cda64c80/$sha256/vs_BuildTools.exe"
          Invoke-WebRequest -Uri $url -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          $observedSha256 = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedSha256 -ne $sha256 -or $signature.Status -ne 'Valid' -or
            $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation(?:,|$)') {
            throw 'Visual Studio Build Tools installer identity does not match the pinned Microsoft release.'
          }
          $quotedPath = '"' + $installPath + '"'
          $process = Start-Process -FilePath $download -Wait -PassThru -ArgumentList @(
            '--quiet', '--wait', '--norestart', '--nocache', '--installPath', $quotedPath,
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64.Spectre',
            '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100'
          )
          if ($process.ExitCode -notin @(0, 3010)) { throw "Visual Studio Build Tools install returned $($process.ExitCode)." }
      - name: Build and verify the locked source
        run: |
          node scripts/build-cua-driver-provider.mjs --platform "$PROVIDER_TARGET" --work-dir "$RUNNER_TEMP/cua-build" --output-dir "$GITHUB_WORKSPACE/provider-output"
          node scripts/verify-cua-driver-source-build.mjs --attestation "$GITHUB_WORKSPACE/provider-output/source-build-attestation.json" --output-root "$GITHUB_WORKSPACE/provider-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-build-${{ inputs.platform }}-${{ matrix.replica }}
          path: provider-output/
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ${{ inputs.platform == 'darwin' && 'macos-26' || 'windows-2022' }}
    defaults:
      run:
        shell: bash
    env:
      PROVIDER_TARGET: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: candidates
          pattern: source-build-*
      - name: Compare independent builds
        run: |
          node scripts/verify-cua-driver-source-build.mjs --compare-a "$GITHUB_WORKSPACE/candidates/source-build-$PROVIDER_TARGET-a" --compare-b "$GITHUB_WORKSPACE/candidates/source-build-$PROVIDER_TARGET-b"
