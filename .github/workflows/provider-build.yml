name: Provider native build

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Target with the locked native toolchain
        required: true
        options: [darwin, win32-x64]
      candidate_run_id:
        type: string
        description: Successful A/B run to reverify for a review-only platform lock proposal
        required: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.candidate_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    runs-on: ${{ inputs.platform == 'darwin' && 'macos-26' || 'windows-2022' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PROVIDER_TARGET: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - name: Prepare the locked Rust toolchain
        run: |
          rust_version=$(node -p 'require("./provider/0.8.3-ling.1/source-build-inputs.json").toolchain.rustcVersion')
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt
      - name: Install the locked Windows Build Tools
        if: inputs.platform == 'win32-x64'
        shell: pwsh
        run: ./scripts/install-windows-provider-build-tools.ps1
      - name: Build and verify the locked source
        run: |
          node scripts/build-cua-driver-provider.mjs --platform "$PROVIDER_TARGET" --work-dir "$RUNNER_TEMP/cua-build" --output-dir "$GITHUB_WORKSPACE/provider-output"
          node scripts/verify-cua-driver-source-build.mjs --attestation "$GITHUB_WORKSPACE/provider-output/source-build-attestation.json" --output-root "$GITHUB_WORKSPACE/provider-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-build-${{ inputs.platform }}-${{ matrix.replica }}
          path: provider-output/
          if-no-files-found: error
  compare:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.candidate_run_id != '')) }}
    runs-on: ${{ inputs.platform == 'darwin' && 'macos-26' || 'windows-2022' }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      PROVIDER_TARGET: ${{ inputs.platform }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - name: Bind the candidate run and artifact identities
        if: inputs.candidate_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const { CANDIDATE_RUN_ID: id, GITHUB_REPOSITORY: repository, GITHUB_REPOSITORY_ID: repositoryId,
            PROVIDER_TARGET: platform, RUNNER_TEMP: temporary } = process.env;
          if (!/^[1-9][0-9]*$/u.test(id ?? "")) throw new Error("Expected a numeric Actions run ID.");
          const api = (path) => JSON.parse(execFileSync("gh", ["api", path], { encoding: "utf8" }));
          const run = api(`repos/${repository}/actions/runs/${id}`);
          if (String(run.id) !== id || String(run.head_repository?.id) !== repositoryId
            || run.path !== ".github/workflows/provider-build.yml" || run.event !== "workflow_dispatch"
            || run.status !== "completed" || run.conclusion !== "success") {
            throw new Error("Expected a successful native workflow run from this repository.");
          }
          const { artifacts } = api(`repos/${repository}/actions/runs/${id}/artifacts`);
          const candidates = ["a", "b"].map((replica) => {
            const matches = artifacts.filter(({ name }) => name === `source-build-${platform}-${replica}`);
            const [artifact] = matches;
            if (matches.length !== 1 || artifact.expired
              || !/^sha256:[a-f0-9]{64}$/u.test(artifact.digest ?? "")
              || artifact.workflow_run?.head_sha !== run.head_sha) {
              throw new Error(`Expected one retained ${platform} artifact for replica ${replica}.`);
            }
            return { id: artifact.id, name: artifact.name, digest: artifact.digest };
          });
          const root = join(temporary, "provider-promotion-review");
          mkdirSync(root);
          writeFileSync(join(root, "candidate-run.json"), JSON.stringify({
            repository, runId: run.id, headSha: run.head_sha, url: run.html_url, platform, candidates,
          }, null, 2) + "\n", { flag: "wx" });
          NODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: candidates
          pattern: source-build-${{ inputs.platform }}-*
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Compare independent builds
        run: |
          node scripts/verify-cua-driver-source-build.mjs --compare-a "$GITHUB_WORKSPACE/candidates/source-build-$PROVIDER_TARGET-a" --compare-b "$GITHUB_WORKSPACE/candidates/source-build-$PROVIDER_TARGET-b"
      - name: Prepare the review verification toolchain
        if: inputs.candidate_run_id != '' && inputs.platform == 'win32-x64'
        run: |
          rust_version=$(node -p 'require("./provider/0.8.3-ling.1/source-build-inputs.json").toolchain.rustcVersion')
          rustup toolchain install "$rust_version" --profile minimal
      - name: Install the locked Windows Build Tools
        if: inputs.candidate_run_id != '' && inputs.platform == 'win32-x64'
        shell: pwsh
        run: ./scripts/install-windows-provider-build-tools.ps1
      - name: Reverify the native outputs and prepare a lock proposal
        if: inputs.candidate_run_id != ''
        run: |
          node --input-type=module <<'NODE'
          import { join } from "node:path";
          import { verifyToolchain } from "./scripts/cua-driver-source-build-toolchain.mjs";
          import { PROVIDER_RESOURCE_ROOT, verifyProviderInputs } from "./scripts/cua-driver-source-build-lib.mjs";
          import { promoteCuaDriverSourceBuild } from "./scripts/cua-driver-source-build-promotion-lib.mjs";

          const { PROVIDER_TARGET: platform, GITHUB_WORKSPACE: workspace, RUNNER_TEMP: temporary } = process.env;
          if (platform === "win32-x64") {
            const { lock } = await verifyProviderInputs(PROVIDER_RESOURCE_ROOT);
            const { env } = await verifyToolchain(platform, lock);
            Object.assign(process.env, env);
          }
          const result = await promoteCuaDriverSourceBuild({
            platform,
            candidateA: join(workspace, "candidates", `source-build-${platform}-a`),
            candidateB: join(workspace, "candidates", `source-build-${platform}-b`),
            outputDir: join(temporary, "provider-promotion-review", "proposal"),
          });
          process.stdout.write(JSON.stringify(result, null, 2) + "\n");
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.candidate_run_id != ''
        with:
          name: source-build-promotion-${{ inputs.platform }}
          path: ${{ runner.temp }}/provider-promotion-review/
          if-no-files-found: error
