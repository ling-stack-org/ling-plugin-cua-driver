name: Provider source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.1
      - run: node scripts/build-cua-driver-provider.mjs --verify-only --platform darwin --output-dir "$RUNNER_TEMP/provider-verify"
      - run: node --test test/*.test.mjs
